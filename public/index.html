<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadro de mandos · Gestor de Tareas</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>Cuadro de mandos del equipo</h1>
      <div class="actions">
        <button class="btn-secondary" id="btn-team">Gestionar equipo</button>
        <button class="btn-primary" id="btn-new-task">+ Nueva tarea</button>
        <button class="btn-secondary" id="btn-logout">Cerrar sesión</button>
      </div>
    </header>

    <div class="stats-row" id="stats-row"></div>

    <div class="filters">
      <select id="filter-status">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="en_curso">En curso</option>
        <option value="hecha">Hecha</option>
      </select>
      <select id="filter-priority">
        <option value="">Todas las prioridades</option>
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
        <option value="urgente">Urgente</option>
      </select>
      <select id="filter-assignee">
        <option value="">Todo el equipo</option>
      </select>
      <button class="btn-secondary btn-sm" id="btn-refresh">Actualizar ahora</button>
    </div>

    <div id="board"></div>
  </div>

  <!-- Modal: nueva/editar tarea -->
  <div class="modal-overlay hidden" id="task-modal-overlay">
    <div class="modal">
      <h2 id="task-modal-title">Nueva tarea</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <label for="task-title">Título</label>
        <input type="text" id="task-title" required />

        <label for="task-description">Descripción (opcional)</label>
        <textarea id="task-description"></textarea>

        <label for="task-assignee">Asignar a</label>
        <select id="task-assignee" required></select>

        <div class="two-col">
          <div>
            <label for="task-priority">Prioridad</label>
            <select id="task-priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
          <div>
            <label for="task-due">Fecha límite</label>
            <input type="date" id="task-due" />
          </div>
        </div>

        <div class="error-text" id="task-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="task-cancel">Cancelar</button>
          <button type="submit" class="btn-primary" id="task-submit">Crear y enviar correo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: gestionar equipo -->
  <div class="modal-overlay hidden" id="team-modal-overlay">
    <div class="modal">
      <h2>Equipo</h2>
      <div id="team-list" style="margin-bottom:18px;"></div>
      <h2 style="font-size:15px;">Añadir integrante</h2>
      <form id="team-form">
        <label for="member-name">Nombre</label>
        <input type="text" id="member-name" required />
        <label for="member-email">Correo electrónico</label>
        <input type="email" id="member-email" required />
        <div class="error-text" id="team-error"></div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="team-close">Cerrar</button>
          <button type="submit" class="btn-primary">Añadir</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
